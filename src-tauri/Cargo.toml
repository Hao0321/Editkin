[package]
name = "editkin"
version = "0.15.0"
edition = "2021"
rust-version = "1.92"

[features]
default = []
community-desktop = []
# Historical research surface only. src/main.rs deliberately compile-errors if enabled.
auto-roto-research = []

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }
serde_json = "1"
sha2 = "0.10"

[dependencies]
arboard = "3.6"
getrandom = "0.3"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "=2.12.0", features = ["protocol-asset"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

# Keep the complete GTK 0.19 / GLib 0.22 chain on reviewed immutable
# upstream migration revisions until compatible versions reach crates.io.
[patch.crates-io]
# tauri-apps/tauri#16170
tauri = { git = "https://github.com/tauri-apps/tauri.git", rev = "899ca2105ffd06293013b6d2bff4416987d99010" }
tauri-build = { git = "https://github.com/tauri-apps/tauri.git", rev = "899ca2105ffd06293013b6d2bff4416987d99010" }
tauri-codegen = { git = "https://github.com/tauri-apps/tauri.git", rev = "899ca2105ffd06293013b6d2bff4416987d99010" }
tauri-macros = { git = "https://github.com/tauri-apps/tauri.git", rev = "899ca2105ffd06293013b6d2bff4416987d99010" }
tauri-runtime = { git = "https://github.com/tauri-apps/tauri.git", rev = "899ca2105ffd06293013b6d2bff4416987d99010" }
tauri-runtime-wry = { git = "https://github.com/tauri-apps/tauri.git", rev = "899ca2105ffd06293013b6d2bff4416987d99010" }
tauri-utils = { git = "https://github.com/tauri-apps/tauri.git", rev = "899ca2105ffd06293013b6d2bff4416987d99010" }
# tauri-apps/tao#1332 and tauri-apps/wry#1843
tao = { git = "https://github.com/tauri-apps/tao.git", rev = "08660027c723e09a45b10badf60a73a661c94a95" }
wry = { git = "https://github.com/tauri-apps/wry.git", rev = "327242ae73301c5e34dcc158e31ae453e8afe837" }
# tauri-apps/webkit2gtk-rs#167 includes the #166 dependency migration.
webkit2gtk = { git = "https://github.com/tauri-apps/webkit2gtk-rs.git", rev = "f5c3825c3f21c44ce346a5aa42e8c33a762f9f72" }
webkit2gtk-sys = { git = "https://github.com/tauri-apps/webkit2gtk-rs.git", rev = "f5c3825c3f21c44ce346a5aa42e8c33a762f9f72" }
# tauri-apps/muda#403, tray-icon#369 and libappindicator-rs#53
muda = { git = "https://github.com/tauri-apps/muda.git", rev = "e4b5c4cf58935cd7a387a6843f099e535bdf3c4a" }
tray-icon = { git = "https://github.com/tauri-apps/tray-icon.git", rev = "79b656b7a61b6b551f90ed1b137bf17a920f6d0b" }
libappindicator = { git = "https://github.com/tauri-apps/libappindicator-rs.git", rev = "f2617d92288e2f0a2f998d3cd46c003e3a5c6d93" }
libappindicator-sys = { git = "https://github.com/tauri-apps/libappindicator-rs.git", rev = "f2617d92288e2f0a2f998d3cd46c003e3a5c6d93" }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

# Resident audio checks the complete decoder binary before opening its owner.
# Unoptimized SHA-256 dominated measured development playback startup (6+ s).
# Optimize the existing implementation, never skip or weaken the identity check.
[profile.dev.package.sha2]
opt-level = 3

# These crates compress the embedded fonts/LUTs during compilation. Cargo's
# build-dependency default is opt-level 0; optimize only this lossless packer
# and its callsite, retaining Tauri's release Brotli quality 9.
[profile.release.package.tauri-codegen]
opt-level = 3
debug-assertions = false

[profile.release.package.brotli]
opt-level = 3
debug-assertions = false
