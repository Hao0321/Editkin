version: 2

# Weekly update PRs for the pinned Actions, the npm lockfile and the two Rust
# lockfiles that ship in the product. Minor and patch updates are grouped so a
# weekly run opens one PR per ecosystem instead of one per package; major bumps
# stay separate so a maintainer reviews each one. Every update still goes
# through the normal PR boundary (Source CI, dependency review, CODEOWNERS).
#
# Not listed on purpose:
# - native/effect-test-plugin has no registry crates.
# - spikes/gpu-compositor is not part of the shipped product.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-src-tauri:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /native/hao-core
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-hao-core:
        update-types: [minor, patch]
